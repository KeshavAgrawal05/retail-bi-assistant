<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retail BI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg: #14181C;
    --panel: #1C2127;
    --panel-border: #2A2F37;
    --accent: #E8A33D;
    --text: #F0EDE6;
    --muted: #8B93A1;
    --positive: #4CAF7D;
    --negative: #E05C5C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.5;
  }
  .app { max-width: 1100px; margin: 0 auto; padding: 48px 24px 96px; }
  header { margin-bottom: 40px; border-bottom: 1px solid var(--panel-border); padding-bottom: 24px; }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 2.1rem;
    letter-spacing: -0.01em;
  }
  header p { color: var(--muted); margin-top: 8px; font-size: 0.95rem; max-width: 560px; }

  .ask-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 24px;
    margin-bottom: 32px;
  }
  .ask-panel label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .ask-row { display: flex; gap: 10px; }
  .ask-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.95rem;
  }
  .ask-row input:focus { outline: none; border-color: var(--accent); }
  .ask-row button {
    background: var(--accent);
    color: #1A1400;
    border: none;
    border-radius: 3px;
    padding: 0 22px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .ask-row button:disabled { opacity: 0.5; cursor: default; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 3px;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }

  .answer-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 24px;
    margin-bottom: 40px;
  }
  .answer-card .q-label { color: var(--accent); font-size: 0.78rem; font-family: 'IBM Plex Mono', monospace; margin-bottom: 10px; }
  .answer-card .answer-text { font-size: 1rem; line-height: 1.7; white-space: pre-wrap; }
  .loading { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; }
  .error-text { color: var(--negative); font-size: 0.9rem; }

  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 20px;
    padding-top: 24px;
    border-top: 1px solid var(--panel-border);
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

  .chart-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 20px;
  }
  .chart-card h3 { font-size: 0.95rem; font-weight: 500; margin-bottom: 4px; }
  .chart-card .stat-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .stat-line .pos { color: var(--positive); }
  .stat-line .neg { color: var(--negative); }

  .bar-row { display: flex; align-items: center; margin-bottom: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; }
  .bar-label { width: 90px; color: var(--muted); flex-shrink: 0; }
  .bar-track { flex: 1; background: #262B32; border-radius: 2px; height: 20px; position: relative; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .bar-value { width: 70px; text-align: right; flex-shrink: 0; padding-left: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const API_BASE = "http://localhost:8000";

const EXAMPLE_QUESTIONS = [
  "Which category is underperforming this quarter, and why?",
  "Which region had the biggest revenue drop recently?",
  "Is there a seasonal pattern in Technology sales?",
  "Which categories are losing money despite high sales?",
];

// ---------- Simple, dependency-free SVG chart primitives ----------

function LineChart({ data, xKey, yKey, color = "#E8A33D", height = 160 }) {
  if (!data || data.length === 0) return <div className="loading">Loading…</div>;
  const width = 400;
  const padding = 20;
  const values = data.map((d) => d[yKey]);
  const minY = Math.min(...values, 0);
  const maxY = Math.max(...values);
  const range = maxY - minY || 1;

  const points = data.map((d, i) => {
    const x = padding + (i / (data.length - 1 || 1)) * (width - padding * 2);
    const y = height - padding - ((d[yKey] - minY) / range) * (height - padding * 2);
    return `${x},${y}`;
  });

  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height}>
      <polyline points={points.join(" ")} fill="none" stroke={color} strokeWidth="2" />
      {data.map((d, i) => {
        const [x, y] = points[i].split(",");
        return <circle key={i} cx={x} cy={y} r="2.5" fill={color} />;
      })}
    </svg>
  );
}

function BarList({ data, labelKey, valueKey, colorFn }) {
  if (!data || data.length === 0) return <div className="loading">Loading…</div>;
  const maxAbs = Math.max(...data.map((d) => Math.abs(d[valueKey])), 1);
  return (
    <div>
      {data.map((d, i) => {
        const pct = (Math.abs(d[valueKey]) / maxAbs) * 100;
        const color = colorFn ? colorFn(d) : "#E8A33D";
        return (
          <div className="bar-row" key={i}>
            <div className="bar-label">{d[labelKey]}</div>
            <div className="bar-track">
              <div className="bar-fill" style={{ width: `${pct}%`, background: color }} />
            </div>
            <div className="bar-value">{typeof d[valueKey] === "number" ? d[valueKey].toLocaleString() : d[valueKey]}</div>
          </div>
        );
      })}
    </div>
  );
}

// ---------- App components ----------

function AskPanel({ onAsk, loading }) {
  const [question, setQuestion] = useState("");
  const submit = () => { if (question.trim()) onAsk(question.trim()); };
  return (
    <div className="ask-panel">
      <label>Ask a question about your retail data</label>
      <div className="ask-row">
        <input
          value={question}
          onChange={(e) => setQuestion(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          placeholder="e.g. Why did the West region decline recently?"
        />
        <button onClick={submit} disabled={loading}>{loading ? "Thinking…" : "Ask"}</button>
      </div>
      <div className="chips">
        {EXAMPLE_QUESTIONS.map((q) => (
          <button key={q} className="chip" onClick={() => onAsk(q)}>{q}</button>
        ))}
      </div>
    </div>
  );
}

function AnswerCard({ question, answer, loading, error }) {
  if (!question) return null;
  return (
    <div className="answer-card">
      <div className="q-label">Q: {question}</div>
      {loading && <div className="loading">Calling analytics tools and generating explanation…</div>}
      {error && <div className="error-text">{error}</div>}
      {answer && !loading && <div className="answer-text">{answer}</div>}
    </div>
  );
}

function MonthlyTrendChart() {
  const [data, setData] = useState(null);
  useEffect(() => {
    fetch(`${API_BASE}/analytics/monthly-trend`).then((r) => r.json()).then((d) => setData(d.data));
  }, []);
  return (
    <div className="chart-card">
      <h3>Monthly Revenue Trend</h3>
      <div className="stat-line">All categories, all regions</div>
      <LineChart data={data} xKey="Month" yKey="Sales" />
    </div>
  );
}

function CategoryPerformanceChart() {
  const [data, setData] = useState(null);
  const [summary, setSummary] = useState(null);
  useEffect(() => {
    fetch(`${API_BASE}/analytics/category-performance`).then((r) => r.json()).then((d) => { setData(d.data); setSummary(d.summary); });
  }, []);
  return (
    <div className="chart-card">
      <h3>Category Performance (Latest Quarter)</h3>
      <div className="stat-line">
        Worst: <span className="neg">{summary?.worst_performer}</span> · Best: <span className="pos">{summary?.best_performer}</span>
      </div>
      <BarList data={data} labelKey="category" valueKey="quarter_revenue" colorFn={() => "#E8A33D"} />
    </div>
  );
}

function RegionRevenueChart() {
  const [data, setData] = useState(null);
  const [summary, setSummary] = useState(null);
  useEffect(() => {
    fetch(`${API_BASE}/analytics/region-revenue`).then((r) => r.json()).then((d) => { setData(d.data); setSummary(d.summary); });
  }, []);
  return (
    <div className="chart-card">
      <h3>Regional Revenue Change (%)</h3>
      <div className="stat-line">
        Biggest decline: <span className="neg">{summary?.biggest_decline_region} ({summary?.biggest_decline_pct}%)</span>
      </div>
      <BarList data={data} labelKey="region" valueKey="pct_change" colorFn={(d) => (d.pct_change < 0 ? "#E05C5C" : "#4CAF7D")} />
    </div>
  );
}

function SegmentProfitabilityChart() {
  const [data, setData] = useState(null);
  useEffect(() => {
    fetch(`${API_BASE}/analytics/segment-profitability`).then((r) => r.json()).then((d) => setData(d.data));
  }, []);
  return (
    <div className="chart-card">
      <h3>Profit by Customer Segment</h3>
      <div className="stat-line">Total profit, by segment</div>
      <BarList data={data} labelKey="Segment" valueKey="total_profit" colorFn={() => "#4CAF7D"} />
    </div>
  );
}

function App() {
  const [question, setQuestion] = useState("");
  const [answer, setAnswer] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  const handleAsk = async (q) => {
    setQuestion(q); setAnswer(""); setError(""); setLoading(true);
    try {
      const res = await fetch(`${API_BASE}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q }),
      });
      if (!res.ok) throw new Error(`Server error (${res.status})`);
      const data = await res.json();
      setAnswer(data.answer);
    } catch (e) {
      setError(`Couldn't reach the assistant: ${e.message}. Is the backend running on port 8000?`);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="app">
      <header>
        <h1>Retail BI Assistant</h1>
        <p>Ask plain-English questions about sales, revenue, and profitability — every answer is grounded in real computed numbers, never invented.</p>
      </header>
      <AskPanel onAsk={handleAsk} loading={loading} />
      <AnswerCard question={question} answer={answer} loading={loading} error={error} />
      <div className="section-title">Dashboard Overview</div>
      <div className="grid">
        <MonthlyTrendChart />
        <CategoryPerformanceChart />
        <RegionRevenueChart />
        <SegmentProfitabilityChart />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
